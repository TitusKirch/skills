# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: OpenCode compatibility

on:
  pull_request:
    branches:
      - main
      - dev
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'skills/**'
      - 'scripts/gen-skills.ts'
      - 'scripts/link-skills.sh'
      - 'scripts/skills-lib.sh'
      - 'scripts/toolchain-versions.json'
      - 'test/helpers.ts'
      - 'test/opencode-compatibility.test.ts'
      - 'package.json'
      - '.github/workflows/opencode-compatibility.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  opencode:
    name: OpenCode
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Read the pinned OpenCode version
        run: |
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const { opencode } = JSON.parse(readFileSync("scripts/toolchain-versions.json", "utf8"));
            if (!/^\d+\.\d+\.\d+$/.test(opencode)) throw new Error("OpenCode must be a stable exact version");
            console.log(`OPENCODE_VERSION=${opencode}`);
          ' >> "$GITHUB_ENV"

      # opencode-ai fetches its platform binary in postinstall, which pnpm skips unless
      # the package is explicitly allowed to build.
      - name: Install the pinned OpenCode CLI
        run: pnpm config set global-bin-dir "$HOME/.local/bin" && pnpm add --global --allow-build=opencode-ai "opencode-ai@$OPENCODE_VERSION" && echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Verify linked skill discovery and queue permissions
        env:
          OPENCODE_REQUIRED: 'true'
        run: pnpm opencode:check
