name: ❓ Question
description: Ask a question about usage, configuration, or behavior
labels: ['question', 'triage']
body:
  - type: textarea
    id: question
    attributes:
      label: Your question
    validations:
      required: true

  - type: textarea
    id: tried
    attributes:
      label: What have you tried?
      description: Configs, prompts, docs you've already looked at.

  - type: input
    id: skill
    attributes:
      label: Affected skill (if any)
      placeholder: e.g. example-skill
