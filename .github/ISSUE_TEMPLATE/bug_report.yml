name: 🐛 Bug report
description: A skill isn't working as expected
labels: ['bug', 'needs triage']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please fill out the form below.
        For security vulnerabilities, see [SECURITY.md](https://github.com/TitusKirch/skills/blob/main/SECURITY.md) instead.

  - type: input
    id: skill
    attributes:
      label: Affected skill
      placeholder: e.g. example-skill
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Repo / skill version
      placeholder: e.g. 0.1.0
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear, concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Prompt / steps to reproduce.
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Logs, screenshots, related config, etc.
